<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Lens TS (WebGL 2.0)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      #webgl-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #webgl-canvas:active {
        cursor: grabbing;
      }
      .panel {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 310px;
        background: rgba(20, 20, 26, 0.78);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
        z-index: 10;
      }
      .panel h2 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 14px;
        letter-spacing: -0.2px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 6px;
      }
      select, input[type="range"] {
        width: 100%;
      }
      select {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        padding: 6px 10px;
        border-radius: 8px;
        outline: none;
      }
      .tip {
        position: absolute;
        top: 28px;
        left: 32px;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 10px 16px;
        border-radius: 24px;
        font-size: 13px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="tip">💧 拖拽中间的液态透镜，滑过文字与色带查看真实物理倒像与 6-Tap 光谱色散</div>
    <canvas id="webgl-canvas"></canvas>

    <div class="panel">
      <h2>液态玻璃透镜调节 (TS + WebGL)</h2>
      <div class="field">
        <label>折射模式</label>
        <select id="mode-select">
          <option value="opticalInversion" selected>真实物理倒像 (凸透镜 UV 折叠)</option>
          <option value="foldFree">防撕裂单调放大 (UI可读)</option>
        </select>
      </div>
      <div class="field">
        <label>边缘倒角厚度 (Bevel)</label>
        <input id="bezel-slider" type="range" min="8" max="40" value="22" />
      </div>
      <div class="field">
        <label>折射位移强度 (Strength)</label>
        <input id="strength-slider" type="range" min="0" max="60" value="32" />
      </div>
      <div class="field">
        <label>6-Tap 光谱色散 (Dispersion)</label>
        <input id="dispersion-slider" type="range" min="0" max="2" step="0.05" value="0.9" />
      </div>
      <div class="field">
        <label>菲涅尔边缘高光 (Fresnel)</label>
        <input id="fresnel-slider" type="range" min="0" max="1" step="0.05" value="0.85" />
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
